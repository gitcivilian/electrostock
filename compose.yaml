services:
  mongo:
    image: mongo:8.0
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: electrostock_admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Generate your .env first}
      MONGO_INITDB_DATABASE: electrostock
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Generate your .env first}
    volumes:
      - mongo-data:/data/db
      - ./infra/mongo/init.js:/docker-entrypoint-initdb.d/01-electrostock.js:ro
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --nodb
        - --eval
        - 'const app = new Mongo("mongodb://electrostock_app:" + encodeURIComponent(process.env.MONGO_APP_PASSWORD) + "@127.0.0.1:27017/electrostock?authSource=electrostock"); const data = app.getDB("electrostock").getCollection("_setup").findOne({_id: "initialized"}); quit(data ? 0 : 1)'
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 12

volumes:
  mongo-data:
