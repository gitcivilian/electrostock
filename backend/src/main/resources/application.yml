spring:
  application:
    name: electrostock
  config:
    import: "optional:file:../.env[.properties]"
  data:
    mongodb:
      uri: "${MONGODB_URI:mongodb://electrostock_app:${MONGO_APP_PASSWORD}@127.0.0.1:27017/electrostock?authSource=electrostock&serverSelectionTimeoutMS=3000}"
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health
